<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Voti Scolastici</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Registro Voti</h1>
        
        <div class="input-section">
            <input type="number" id="votoInput" placeholder="Inserisci voto (1-10)" step="0.1" min="1" max="10">
            <button id="addBtn">Aggiungi Voto</button>
        </div>

        <div id="errorMessage" class="error"></div>

        <div class="results-section">
            <h3>Media Attuale: <span id="mediaValore">-</span></h3>
            <div id="statusIcon" class="icon"></div>
        </div>

        <div class="list-section">
            <h3>Storico Voti</h3>
            <ul id="listaVoti"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
